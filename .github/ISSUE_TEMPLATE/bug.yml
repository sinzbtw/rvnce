name: Bug report
description: Report unexpected behavior
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the expected result.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include your browser version and whether you used the editor or an exported site. Remove personal data from any sample.
    validations:
      required: true
